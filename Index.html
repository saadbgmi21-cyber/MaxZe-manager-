<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXZE ACCOUNT MANAGER</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui;background:#000;color:#fff}.card{background:#111113;border:1px solid #222}</style></head><body><div id="app"></div><script>
let state={view:'dashboard',user:JSON.parse(localStorage.getItem('MAXZE_USER')||'null'),data:JSON.parse(localStorage.getItem('MAXZE_DATA')||'{"room_cards":[{"id":"1","account_name":"TMZxMaxZeIGL","initial_investment":430,"initial_cards":8,"cards_sold":4,"additional_cards":0,"cards_used":0,"other_deductions":0,"status":"Active","recorded_available_cards":4},{"id":"2","account_name":"TMZxMaxZee","initial_investment":350,"initial_cards":8,"cards_sold":7,"additional_cards":0,"cards_used":0,"other_deductions":0,"status":"Active","recorded_available_cards":1},{"id":"3","account_name":"TMZxMaker","initial_investment":350,"initial_cards":14,"cards_sold":0,"additional_cards":0,"cards_used":0,"other_deductions":0,"status":"Active","recorded_available_cards":14}],"sales":[{"transaction_no":"SALE-001","buyer_name":"Risky Esports","quantity":8,"unit_price":40,"total_amount":320,"amount_received":320,"sale_date":"2026-10-12","amount_pending":0}],"uc":[{"account_name":"TMZxMaxZeIGL","initial_uc":48,"available_uc":48},{"account_name":"TMZxMaxZee","initial_uc":200,"available_uc":200},{"account_name":"TMZxMaker","initial_uc":40,"available_uc":40}],"returners":[{"record_no":"RET-001","room_maker_name":"Room Maker 1","off_date":"2026-10-12","off_duration":21},{"record_no":"RET-002","room_maker_name":"Room Maker 2","off_date":"2026-10-12","off_duration":21},{"record_no":"RET-003","room_maker_name":"Room Maker 3","off_date":"2026-10-13","off_duration":21},{"record_no":"RET-004","room_maker_name":"Room Maker 4","off_date":"2026-10-13","off_duration":21},{"record_no":"RET-005","room_maker_name":"Room Maker 5","off_date":"2026-10-13","off_duration":21},{"record_no":"RET-006","room_maker_name":"Room Maker 6","off_date":"2026-10-13","off_duration":21}]}')};
function calcAvail(r){return (r.initial_cards||0)+(r.additional_cards||0)-(r.cards_sold||0)-(r.cards_used||0)-(r.other_deductions||0)}
function calcExp(off,d){let dd=new Date(off);dd.setDate(dd.getDate()+Number(d||21));return dd.toISOString().split('T')[0]}
function save(){localStorage.setItem('MAXZE_DATA',JSON.stringify(state.data));render()}
function render(){
let app=document.getElementById('app');
if(!state.user){app.innerHTML='<div class="min-h-screen flex items-center justify-center p-4 bg-black"><div class="w-full max-w-sm bg-[#111] border border-zinc-800 rounded-2xl p-6 space-y-4"><h1 class="text-2xl font-bold"><span class="text-purple-500">MAXZE</span> MANAGER</h1><p class="text-xs text-zinc-400">Admin Login</p><input id="email" placeholder="admin@maxze.local" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 text-sm"><input id="pass" type="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5 text-sm"><button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 rounded-lg py-2.5 font-medium">Login</button><p class="text-[10px] text-zinc-600">Demo login - any email works. Data saves in browser.</p></div></div>';return}
let inv=state.data.room_cards.reduce((a,c)=>a+(c.initial_investment||0),0);
let sales=state.data.sales.reduce((a,s)=>a+(s.total_amount||0),0);
let cards=state.data.room_cards.reduce((a,c)=>a+calcAvail(c),0);
let uc=state.data.uc.reduce((a,u)=>a+(u.available_uc||0),0);
let content='';
if(state.view==='dashboard'){content='<div class="space-y-6"><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Total Investment</div><div class="text-xl font-bold">₹'+inv+'</div><div class="text-[10px] text-zinc-500 mt-1">Orig 1130</div></div><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Total Sales</div><div class="text-xl font-bold">₹'+sales+'</div><div class="text-[10px] text-zinc-500 mt-1">Orig 612</div></div><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Available Cards</div><div class="text-xl font-bold">'+cards+'</div><div class="text-[10px] text-zinc-500 mt-1">Orig 22</div></div><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Total UC</div><div class="text-xl font-bold">'+uc+'</div><div class="text-[10px] text-zinc-500 mt-1">Orig 288</div></div></div><div class="card rounded-xl p-5"><h3 class="font-semibold mb-2">Reconciliation Panel</h3><p class="text-xs text-zinc-400">Formula: Avail = Initial + Additional - Sold - Used - Other. Original sample Investment ₹1130, Sales ₹612, Cards 22, UC 288. Current calculated: ₹'+inv+', Cards '+cards+', UC '+uc+'. Discrepancy flagged for manual confirmation - no silent correction.</p></div></div>'}
if(state.view==='room_cards'){content='<div class="flex justify-between items-center mb-4"><h1 class="text-xl font-bold">Room Card Inventory</h1><button onclick="addCard()" class="px-4 py-2 bg-purple-600 rounded-lg text-sm font-medium">+ Add New</button></div><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="text-xs text-zinc-500 uppercase"><tr><th class="p-3 text-left">Account</th><th class="p-3">Initial</th><th class="p-3">Sold</th><th class="p-3">Avail Formula</th><th class="p-3">Actions</th></tr></thead><tbody>'+state.data.room_cards.map(c=>'<tr class="border-b border-zinc-900 hover:bg-zinc-900/50"><td class="p-3 font-medium">'+c.account_name+'</td><td class="p-3 text-center">'+c.initial_cards+'</td><td class="p-3 text-center">'+(c.cards_sold||0)+'</td><td class="p-3 text-center '+(calcAvail(c)!==c.recorded_available_cards?'text-amber-400':'')+'">'+calcAvail(c)+' '+(calcAvail(c)!==c.recorded_available_cards?'(rec '+c.recorded_available_cards+')':'')+'</td><td class="p-3 flex gap-1 justify-center"><button onclick="editCard(\''+c.id+'\')" class="px-2 py-1 bg-zinc-800 rounded text-xs">Edit</button><button onclick="delCard(\''+c.id+'\')" class="px-2 py-1 bg-red-900/40 rounded text-xs">Del</button></td></tr>').join('')+'</tbody></table></div>'}
if(state.view==='sales'){content='<div class="flex justify-between items-center mb-4"><h1 class="text-xl font-bold">Sales & Buyer Management</h1><button onclick="addSale()" class="px-4 py-2 bg-purple-600 rounded-lg text-sm">+ Add Sale</button></div><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="text-xs text-zinc-500 uppercase"><tr><th class="p-3 text-left">Txn No</th><th class="p-3 text-left">Buyer</th><th class="p-3">Qty x Price</th><th class="p-3">Total</th><th class="p-3">Pending = Total-Received</th></tr></thead><tbody>'+state.data.sales.map(s=>'<tr class="border-b border-zinc-900"><td class="p-3">'+s.transaction_no+'</td><td class="p-3">'+s.buyer_name+'</td><td class="p-3 text-center">'+s.quantity+' x ₹'+s.unit_price+'</td><td class="p-3 text-center">₹'+s.total_amount+'</td><td class="p-3 text-center">₹'+(s.total_amount-s.amount_received)+'</td></tr>').join('')+'</tbody></table></div>'}
if(state.view==='uc'){content='<div class="flex justify-between items-center mb-4"><h1 class="text-xl font-bold">UC Inventory - Total '+uc+'</h1><button onclick="addUC()" class="px-4 py-2 bg-purple-600 rounded-lg text-sm">+ Add UC</button></div><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="text-xs text-zinc-500 uppercase"><tr><th class="p-3 text-left">Account</th><th class="p-3">Initial</th><th class="p-3">Available = Init+Purch+Recv-Used-Sold-Trans</th></tr></thead><tbody>'+state.data.uc.map(u=>'<tr class="border-b border-zinc-900"><td class="p-3">'+u.account_name+'</td><td class="p-3 text-center">'+u.initial_uc+'</td><td class="p-3 text-center font-bold">'+u.available_uc+'</td></tr>').join('')+'</tbody></table></div>'}
if(state.view==='returners'){content='<div class="flex justify-between items-center mb-4"><h1 class="text-xl font-bold">Returner ID Tracker</h1><button onclick="addRet()" class="px-4 py-2 bg-purple-600 rounded-lg text-sm">+ Add Returner</button></div><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="text-xs text-zinc-500 uppercase"><tr><th class="p-3">Record</th><th class="p-3 text-left">Maker</th><th class="p-3">OFF Date</th><th class="p-3">Expected ON = OFF+21</th><th class="p-3">Status</th></tr></thead><tbody>'+state.data.returners.map(r=>{let exp=calcExp(r.off_date,r.off_duration);let diff=Math.ceil((new Date(exp)-new Date())/86400000);let st=diff<0?'OVERDUE':diff===0?'READY TO TURN ON':diff<=3?'UPCOMING':'OFF';let color=diff<0?'bg-red-900/50 text-red-300':diff===0?'bg-green-900/50 text-green-300':diff<=3?'bg-amber-900/50 text-amber-300':'bg-zinc-800 text-zinc-400';return '<tr class="border-b border-zinc-900"><td class="p-3">'+r.record_no+'</td><td class="p-3">'+r.room_maker_name+'</td><td class="p-3 text-center">'+r.off_date+'</td><td class="p-3 text-center font-medium">'+exp+'</td><td class="p-3 text-center"><span class="px-2.5 py-1 rounded-full text-xs '+color+'">'+st+' '+(diff<0?Math.abs(diff)+'d overdue':diff+'d left')+'</span></td></tr>'}).join('')+'</tbody></table></div>'}
app.innerHTML='<div class="min-h-screen flex bg-black text-white"><aside class="w-64 bg-[#0A0A0A] border-r border-zinc-800 hidden md:flex flex-col p-4 fixed h-screen"><div class="text-xl font-bold mb-8"><span class="text-purple-500">MAXZE</span> MANAGER</div><nav class="space-y-1">'+['dashboard','room_cards','sales','uc','returners'].map(v=>'<button onclick="setView(\''+v+'\')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm '+(state.view===v?'bg-zinc-900 text-white font-medium':'text-zinc-400 hover:text-white hover:bg-zinc-900/50')+'">'+v.toUpperCase()+'</button>').join('')+'</nav><div class="mt-auto pt-4 border-t border-zinc-900"><button onclick="logout()" class="w-full text-left text-xs text-zinc-500 px-3 py-2">Logout</button></div></aside><main class="flex-1 md:ml-64 p-4 md:p-6"><div class="md:hidden flex gap-2 mb-4 overflow-x-auto pb-2">'+['dashboard','room_cards','sales','uc','returners'].map(v=>'<button onclick="setView(\''+v+'\')" class="px-3 py-2 rounded-lg text-xs whitespace-nowrap '+(state.view===v?'bg-purple-600 text-white':'bg-zinc-800 text-zinc-400')+'">'+v.toUpperCase()+'</button>').join('')+'</div>'+content+'</main></div>';
}
function login(){let em=document.getElementById('email');state.user={email:em?em.value:'admin'};localStorage.setItem('MAXZE_USER',JSON.stringify(state.user));render()}
function logout(){localStorage.removeItem('MAXZE_USER');state.user=null;render()}
function setView(v){state.view=v;render()}
function addCard(){let n=prompt('Account name:');if(!n)return;let inv=Number(prompt('Investment INR:','350')||0);let c=Number(prompt('Initial cards:','8')||0);state.data.room_cards.push({id:Date.now().toString(),account_name:n,initial_investment:inv,initial_cards:c,cards_sold:0,additional_cards:0,cards_used:0,other_deductions:0,status:'Active',recorded_available_cards:c});save()}
function editCard(id){let r=state.data.room_cards.find(x=>x.id===id);let j=prompt('Edit JSON (all fields editable):',JSON.stringify(r,null,2));if(!j)return;try{let o=JSON.parse(j);let idx=state.data.room_cards.findIndex(x=>x.id===id);state.data.room_cards[idx]=o;save()}catch(e){alert('Invalid JSON')}}
function delCard(id){if(confirm('Delete this account?')){state.data.room_cards=state.data.room_cards.filter(x=>x.id!==id);save()}}
function addSale(){let b=prompt('Buyer Name:','Risky Esports');if(!b)return;let q=Number(prompt('Quantity:','2')||0);let p=Number(prompt('Unit Price INR:','40')||0);let amt=q*p;state.data.sales.push({transaction_no:'SALE-'+Date.now().toString().slice(-6),buyer_name:b,quantity:q,unit_price:p,total_amount:amt,amount_received:amt,sale_date:new Date().toISOString().split('T')[0],amount_pending:0});if(state.data.room_cards[0])state.data.room_cards[0].cards_sold=(state.data.room_cards[0].cards_sold||0)+q;save()}
function addUC(){let n=prompt('Account Name:');if(!n)return;let u=Number(prompt('UC Amount:','100')||0);state.data.uc.push({account_name:n,initial_uc:u,available_uc:u});save()}
function addRet(){let m=prompt('Room Maker Name:','Room Maker 7');if(!m)return;let off=prompt('OFF Date YYYY-MM-DD:',new Date().toISOString().split('T')[0])||new Date().toISOString().split('T')[0];state.data.returners.push({record_no:'RET-'+Date.now().toString().slice(-4),room_maker_name:m,off_date:off,off_duration:21});save()}
render();
</script></body></html>
