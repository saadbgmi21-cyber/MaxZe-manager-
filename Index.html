<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXZE ACCOUNT MANAGER</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui;background:#000;color:#fff}.card{background:#111113;border:1px solid #222}</style></head><body><div id="app"></div><script>
let state={view:'dashboard',user:JSON.parse(localStorage.getItem('MAXZE_USER')||'null'),data:JSON.parse(localStorage.getItem('MAXZE_DATA')||'{"room_cards":[{"id":"1","account_name":"TMZxMaxZeIGL","initial_investment":430,"initial_cards":8,"cards_sold":4,"status":"Active","recorded_available_cards":7},{"id":"2","account_name":"TMZxMaxZee","initial_investment":350,"initial_cards":8,"cards_sold":7,"status":"Low Inventory","recorded_available_cards":1},{"id":"3","account_name":"TMZxMaker","initial_investment":350,"initial_cards":14,"cards_sold":0,"status":"Active","recorded_available_cards":14}],"sales":[{"transaction_no":"SALE-001","buyer_name":"Risky Esports","quantity":8,"unit_price":40,"total_amount":320,"amount_received":320}],"uc":[{"account_name":"TMZxMaxZeIGL","initial_uc":48,"available_uc":48},{"account_name":"TMZxMaxZee","initial_uc":200,"available_uc":200},{"account_name":"TMZxMaker","initial_uc":40,"available_uc":40}],"returners":[{"record_no":"RET-001","room_maker_name":"Room Maker 1","off_date":"2026-10-12","off_duration":21},{"record_no":"RET-002","room_maker_name":"Room Maker 2","off_date":"2026-10-12","off_duration":21},{"record_no":"RET-003","room_maker_name":"Room Maker 3","off_date":"2026-10-13","off_duration":21},{"record_no":"RET-004","room_maker_name":"Room Maker 4","off_date":"2026-10-13","off_duration":21},{"record_no":"RET-005","room_maker_name":"Room Maker 5","off_date":"2026-10-13","off_duration":21},{"record_no":"RET-006","room_maker_name":"Room Maker 6","off_date":"2026-10-13","off_duration":21}]}')};
function calcAvail(r){return (r.initial_cards||0)+(r.additional_cards||0)-(r.cards_sold||0)-(r.cards_used||0)-(r.other_deductions||0)}
function calcExp(off,d){let dd=new Date(off);dd.setDate(dd.getDate()+Number(d||21));return dd.toISOString().split('T')[0]}
function save(){localStorage.setItem('MAXZE_DATA',JSON.stringify(state.data));render()}
function render(){
let app=document.getElementById('app');
if(!state.user){app.innerHTML='<div class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-sm bg-[#111] border border-zinc-800 rounded-2xl p-6 space-y-4"><h1 class="text-2xl font-bold"><span class="text-purple-500">MAXZE</span> MANAGER</h1><input id="email" placeholder="Admin email" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm"><input id="pass" type="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm"><button onclick="login()" class="w-full bg-purple-600 rounded-lg py-2">Login Demo</button></div></div>';return}
let inv=state.data.room_cards.reduce((a,c)=>a+(c.initial_investment||0),0);
let sales=state.data.sales.reduce((a,s)=>a+(s.total_amount||0),0);
let cards=state.data.room_cards.reduce((a,c)=>a+calcAvail(c),0);
let uc=state.data.uc.reduce((a,u)=>a+(u.available_uc||0),0);
let content='';
if(state.view==='dashboard'){content='<div class="space-y-6"><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Total Investment</div><div class="text-xl font-bold">₹'+inv+'</div></div><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Total Sales</div><div class="text-xl font-bold">₹'+sales+'</div></div><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Available Cards</div><div class="text-xl font-bold">'+cards+'</div></div><div class="card rounded-xl p-4"><div class="text-[10px] text-zinc-500 uppercase">Total UC</div><div class="text-xl font-bold">'+uc+'</div></div></div><div class="card rounded-xl p-4"><h3 class="font-semibold">Reconciliation</h3><p class="text-xs text-zinc-400 mt-1">Original: ₹1130 / ₹612 / 22 / 288. Current: ₹'+inv+' / '+cards+' / '+uc+'</p></div></div>'}
if(state.view==='room_cards'){content='<div class="flex justify-between mb-4"><h1 class="text-xl font-bold">Room Card Inventory</h1><button onclick="addCard()" class="px-3 py-1 bg-purple-600 rounded-lg text-sm">+ Add New</button></div><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><thead><tr><th class="p-2 text-left">Account</th><th class="p-2">Init</th><th class="p-2">Sold</th><th class="p-2">Avail</th><th class="p-2">Actions</th></tr></thead><tbody>'+state.data.room_cards.map(c=>'<tr class="border-b border-zinc-900"><td class="p-2">'+c.account_name+'</td><td class="p-2">'+c.initial_cards+'</td><td class="p-2">'+(c.cards_sold||0)+'</td><td class="p-2">'+calcAvail(c)+'</td><td class="p-2"><button onclick="editCard(\''+c.id+'\')" class="px-2 py-1 bg-zinc-800 rounded text-xs">Edit</button> <button onclick="delCard(\''+c.id+'\')" class="px-2 py-1 bg-red-900/40 rounded text-xs">Del</button></td></tr>').join('')+'</tbody></table></div>'}
if(state.view==='sales'){content='<div class="flex justify-between mb-4"><h1 class="text-xl font-bold">Sales</h1><button onclick="addSale()" class="px-3 py-1 bg-purple-600 rounded-lg text-sm">+ Add Sale</button></div><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><tbody>'+state.data.sales.map(s=>'<tr class="border-b border-zinc-900"><td class="p-2">'+s.transaction_no+'</td><td class="p-2">'+s.buyer_name+'</td><td class="p-2">'+s.quantity+' x ₹'+s.unit_price+' = ₹'+s.total_amount+'</td></tr>').join('')+'</tbody></table></div>'}
if(state.view==='uc'){content='<h1 class="text-xl font-bold mb-4">UC Inventory - Total '+uc+'</h1><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><tbody>'+state.data.uc.map(u=>'<tr class="border-b border-zinc-900"><td class="p-2">'+u.account_name+'</td><td class="p-2">'+u.available_uc+' UC</td></tr>').join('')+'</tbody></table></div>'}
if(state.view==='returners'){content='<h1 class="text-xl font-bold mb-4">Returner Tracker</h1><div class="card rounded-xl overflow-auto"><table class="w-full text-sm"><thead><tr><th class="p-2">Maker</th><th class="p-2">OFF</th><th class="p-2">ON</th><th class="p-2">Status</th></tr></thead><tbody>'+state.data.returners.map(r=>{let exp=calcExp(r.off_date,r.off_duration);let diff=Math.ceil((new Date(exp)-new Date())/86400000);let st=diff<0?'OVERDUE':diff===0?'READY TODAY':diff<=3?'UPCOMING':'OFF';return '<tr class="border-b border-zinc-900"><td class="p-2">'+r.room_maker_name+'</td><td class="p-2">'+r.off_date+'</td><td class="p-2">'+exp+'</td><td class="p-2">'+st+'</td></tr>'}).join('')+'</tbody></table></div>'}
app.innerHTML='<div class="min-h-screen flex bg-black text-white"><aside class="w-64 bg-[#0A0A0A] border-r border-zinc-800 hidden md:flex flex-col p-4 fixed h-screen"><div class="text-xl font-bold mb-8"><span class="text-purple-500">MAXZE</span> MANAGER</div><nav class="space-y-1">'+['dashboard','room_cards','sales','uc','returners'].map(v=>'<button onclick="setView(\''+v+'\')" class="w-full text-left px-3 py-2 rounded-lg text-sm '+(state.view===v?'bg-zinc-900 text-white':'text-zinc-400')+'">'+v.toUpperCase()+'</button>').join('')+'</nav><button onclick="logout()" class="mt-auto text-xs text-zinc-500 px-3 py-2">Logout</button></aside><main class="flex-1 md:ml-64 p-4 md:p-6"><div class="md:hidden flex gap-2 mb-4 overflow-auto">'+['dashboard','room_cards','sales','uc','returners'].map(v=>'<button onclick="setView(\''+v+'\')" class="px-3 py-1 rounded-lg text-xs '+(state.view===v?'bg-purple-600':'bg-zinc-800')+'">'+v+'</button>').join('')+'</div>'+content+'</main></div>';
}
function login(){state.user={email:document.getElementById('email').value||'admin'};localStorage.setItem('MAXZE_USER',JSON.stringify(state.user));render()}
function logout(){localStorage.removeItem('MAXZE_USER');state.user=null;render()}
function setView(v){state.view=v;render()}
function addCard(){let n=prompt('Account name:');if(!n)return;let inv=Number(prompt('Investment:','350')||0);let c=Number(prompt('Initial cards:','8')||0);state.data.room_cards.push({id:Date.now().toString(),account_name:n,initial_investment:inv,initial_cards:c,cards_sold:0,status:'Active',recorded_available_cards:c});save()}
function editCard(id){let r=state.data.room_cards.find(x=>x.id===id);let j=prompt('Edit JSON:',JSON.stringify(r,null,2));if(!j)return;try{let o=JSON.parse(j);let idx=state.data.room_cards.findIndex(x=>x.id===id);state.data.room_cards[idx]=o;save()}catch(e){alert('Invalid')}}
function delCard(id){if(confirm('Delete?')){state.data.room_cards=state.data.room_cards.filter(x=>x.id!==id);save()}}
function addSale(){let b=prompt('Buyer:','Risky Esports');let q=Number(prompt('Qty:','2')||0);let p=Number(prompt('Unit price:','40')||0);state.data.sales.push({transaction_no:'SALE-'+Date.now(),buyer_name:b,quantity:q,unit_price:p,total_amount:q*p,amount_received:q*p});if(state.data.room_cards[0])state.data.room_cards[0].cards_sold=(state.data.room_cards[0].cards_sold||0)+q;save()}
render();
</script></body></html>
